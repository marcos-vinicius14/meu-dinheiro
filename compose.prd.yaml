services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: meu-dinheiro-postgres-prd
    restart: unless-stopped
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_prd_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-meu_dinheiro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meu_dinheiro_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: meu-dinheiro-api-prd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${PORT:-8080}:8080'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - meu_dinheiro_net

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: meu-dinheiro-bot-prd
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${WEBHOOK_PORT:-8081}:${WEBHOOK_PORT:-8081}'
    networks:
      - meu_dinheiro_net

volumes:
  postgres_prd_data:

networks:
  meu_dinheiro_net:
    driver: bridge
