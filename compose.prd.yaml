services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: meu-dinheiro-postgres-prd
    restart: unless-stopped
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-meu_dinheiro}
      PGPORT: "5433"
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${POSTGRES_PORT:-5433}:5433'
    volumes:
      - postgres_prd_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-meu_dinheiro}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meu_dinheiro_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: meu-dinheiro-api-prd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      PORT: ${PORT:-8081}
      JWT_SECRET: ${JWT_SECRET}
      BOT_USERNAME: ${BOT_USERNAME}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${PORT:-8081}:${PORT:-8081}'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT:-8081}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - meu_dinheiro_net

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: meu-dinheiro-bot-prd
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      API_BASE_URL: ${API_BASE_URL:-http://api:${PORT:-8081}}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-altere_para_uma_chave_interna_forte_em_producao}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET_TOKEN: ${WEBHOOK_SECRET_TOKEN:-}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8082}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/telegram/webhook}
    env_file:
      - path: .env.prd
        required: false
      - path: .env
        required: false
    ports:
      - '${WEBHOOK_PORT:-8082}:${WEBHOOK_PORT:-8082}'
    networks:
      - meu_dinheiro_net

volumes:
  postgres_prd_data:

networks:
  meu_dinheiro_net:
    driver: bridge
