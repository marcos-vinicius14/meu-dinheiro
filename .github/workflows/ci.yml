name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Verify code formatting (gofmt)
        run: |
          diffs=$(gofmt -s -l .)
          if [ -n "$diffs" ]; then
            echo "Os seguintes arquivos não estão formatados com gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run tests with race detection (unit & integration)
        run: go test -v -race ./...

      - name: Build API binary
        run: go build -v -o ../../bin/api ./cmd/api

  bot:
    name: Bot (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/bot/go.mod
          cache-dependency-path: apps/bot/go.sum

      - name: Verify code formatting (gofmt)
        run: |
          diffs=$(gofmt -s -l .)
          if [ -n "$diffs" ]; then
            echo "Os seguintes arquivos não estão formatados com gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -v -race ./...

      - name: Build Bot binary
        run: go build -v -o ../../bin/bot ./cmd/bot

  web:
    name: Web (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build
