name: Production Deploy (Coolify)

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Build & Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Trigger Coolify Deployment
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_API_URL: ${{ secrets.COOLIFY_WEBHOOK_API_URL }}
          COOLIFY_WEBHOOK_BOT_URL: ${{ secrets.COOLIFY_WEBHOOK_BOT_URL }}
          COOLIFY_WEBHOOK_WEB_URL: ${{ secrets.COOLIFY_WEBHOOK_WEB_URL }}
          COOLIFY_BEARER_TOKEN: ${{ secrets.COOLIFY_BEARER_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Coleta todas as URLs de webhook informadas
          WEBHOOK_URLS=""
          for u in "$COOLIFY_WEBHOOK_URL" "$COOLIFY_WEBHOOK_API_URL" "$COOLIFY_WEBHOOK_BOT_URL" "$COOLIFY_WEBHOOK_WEB_URL"; do
            if [ -n "$u" ]; then
              WEBHOOK_URLS="$WEBHOOK_URLS $u"
            fi
          done

          if [ -z "$WEBHOOK_URLS" ]; then
            echo "::error::Nenhum secret de webhook do Coolify configurado (ex: COOLIFY_WEBHOOK_URL)."
            exit 1
          fi

          AUTH_HEADER=""
          if [ -n "$COOLIFY_BEARER_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $COOLIFY_BEARER_TOKEN"
          fi

          echo "Iniciando trigger de deploy no Coolify para a tag $TAG_NAME..."

          for URL in $WEBHOOK_URLS; do
            # Oculta parâmetros sensíveis para segurança no log
            SAFE_URL=$(echo "$URL" | sed 's/\(uuid=[^&]\{4\}\)[^&]*/\1****/g')
            echo "Chamando webhook: $SAFE_URL"

            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              -H "Content-Type: application/json" \
              -d "{\"tag\": \"$TAG_NAME\", \"ref\": \"${{ github.ref }}\", \"sha\": \"${{ github.sha }}\"}" \
              "$URL")

            echo "Status HTTP retornado: $HTTP_CODE"
            cat response.txt || true
            echo ""

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Falha ao chamar webhook do Coolify (HTTP $HTTP_CODE): $SAFE_URL"
              exit 1
            fi
          done

          echo "Todos os deploys foram disparados com sucesso no Coolify!"
